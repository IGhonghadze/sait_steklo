# ==============================================================================
# Конфигурация Nginx для сайта sait_steklo (для вставки в блок server {})
# ==============================================================================

# 1. Сжатие Gzip
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff
    font/woff2;

# 2. Кэширование статических ассетов (CSS, JS, WebP, AVIF, Шрифты)
location ~* \.(css|js|woff2|woff|ttf|svg|webp|avif|jpg|jpeg|png|gif|ico)$ {
    expires 365d;
    add_header Cache-Control "public, no-transform, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
    log_not_found off;
}

# 3. Видеофайлы (MP4, WebM) - поддержка Range requests для быстрой буферизации
location ~* \.(mp4|webm)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    mp4;
    mp4_buffer_size 1m;
    mp4_max_buffer_size 5m;
}

# 4. HTML страницы - проверка обновлений
location ~* \.html?$ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
}
